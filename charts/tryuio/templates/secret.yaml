{{- if not .Values.existingSecret }}
{{- if not .Values.apiKey }}
{{- fail "either apiKey or existingSecret is required" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  api-key: {{ .Values.apiKey | quote }}
{{- end }}
